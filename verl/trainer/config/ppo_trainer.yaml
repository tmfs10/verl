# Format checks enforced on CI:
# 1. Comments must appear above each field.
# 2. There must be a blank line between each field.
# 3. Inline comments (after a field on the same line) are not allowed.
# 4. Indentation level is respected for nested fields.

# specify the default per-component configs
defaults:

  - model_engine: dp

  # <folder_name>@<field_name>.<field_name>: <yaml_file_name>
  # actor_rollout_ref.actor: trainer/config/actor/dp_actor.yaml
  - actor@actor_rollout_ref.actor: ${model_engine}_actor

  # data: trainer/config/data/legacy_data.yaml
  - data@data: legacy_data

  # Reference model config.
  # Reference model will be enabled when actor.use_kl_loss or/and algorithm.use_kl_in_reward is/are True.
  - ref@actor_rollout_ref.ref: ${model_engine}_ref

  # Rollout model config.
  - rollout@actor_rollout_ref.rollout: rollout

  # Model config.
  - model@actor_rollout_ref.model: hf_model

  # Critic model config.
  - critic@critic: ${model_engine}_critic

  # legacy reward impl config, for backward compatibility
  - legacy_reward_impl

  # Reward config.
  - reward@reward: reward

  # Rollout correction config.
  - algorithm@algorithm.rollout_correction: rollout_correction

  # load the reference default config, then apply the fields in the current yaml
  # self config override anything above
  - _self_

# config for actor, rollout and reference model
actor_rollout_ref:

  # Whether it's a hybrid engine, currently only supports hybrid engine
  hybrid_engine: true

  # Timeout for operations executed against the process group
  nccl_timeout: 600

  # Rollout model config.
  rollout:

    # for huge model, layered summon can save memory (prevent OOM) but make it slower
    layered_summon: False

# config for the algorithm
algorithm:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.trainer.config.AlgoConfig

  # Discount factor for future rewards
  gamma: 1.0

  # Trade-off between bias and variance in the GAE estimator
  lam: 1.0

  # Advantage estimator type: "gae", "grpo", "reinforce_plus_plus", etc.
  adv_estimator: gae

  # Whether to normalize advantages by std (specific to GRPO)
  norm_adv_by_std_in_grpo: True

  # Whether to enable in-reward KL penalty
  use_kl_in_reward: False

  # How to estimate KL divergence: "kl", "abs", "mse", "low_var_kl", or "full"
  kl_penalty: kl

  # KL control configuration
  kl_ctrl:

    # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
    _target_: verl.trainer.config.KLControlConfig

    # KL control type: "fixed" or "adaptive"
    type: fixed

    # Initial coefficient for KL penalty
    kl_coef: 0.001

    # Horizon value for adaptive controller (if enabled)
    horizon: 10000

    # Target KL divergence (used for adaptive controller)
    target_kl: 0.1

  # Whether to enable preference feedback PPO
  use_pf_ppo: False

  # Preference feedback PPO settings
  pf_ppo:

    # Method for reweighting samples: "pow", "max_min", or "max_random"
    reweight_method: pow

    # Power used for weight scaling in "pow" method
    weight_pow: 2.0

  # Synchronous self-critique and intermediate Monte Carlo value supervision.
  intermediate_mc_value:

    # Structured configuration target.
    _target_: verl.trainer.config.IntermediateMCValueConfig

    # Enable synchronous self-critique and intermediate continuation supervision.
    enable: false

    # Critic parameterization: scalar or beta.
    critic_head: scalar

    # Mark selector: random, ema, or variance. Variance requires a beta critic.
    mark_selector: random

    # Number of independent critiques sampled for each solution.
    num_critiques: 4

    # Number of continuation suffixes sampled for every selected mark.
    continuations_per_mark: 1

    # Maximum selected marks; null resolves to 4 for EMA and 1 otherwise. Zero disables continuations.
    max_marks: null

    # Critique token cap; null inherits data.max_response_length.
    critique_max_response_length: null

    # Inclusive lower fraction for eligible nonterminal marks.
    mark_start_fraction: 0.05

    # Inclusive upper fraction for eligible nonterminal marks.
    mark_end_fraction: 0.90

    # Minimum token distance between marks in one rollout.
    min_mark_gap: 32

    # EMA coefficient over critique-averaged critic values.
    ema_alpha: 0.1

    # First one-indexed token eligible to establish the EMA reference.
    ema_baseline_token: 32

    # Positive floor used in EMA ratios.
    ema_floor: 1.0e-4

    # EMA upward ratio threshold.
    ema_ratio_up: 2.0

    # EMA downward ratio threshold.
    ema_ratio_down: 0.5

    # Variance selection scope: rollout, prompt, or batch.
    variance_scope: rollout

    # Per-slot chance to choose a random eligible variance candidate.
    variance_random_probability: 0.05

    # Base seed used by stable mark-selection hashes.
    selection_seed: 0

    # Maximum scalar environment reward.
    max_reward: 1.0

    # Scalar critic loss: mse or bce.
    scalar_loss: mse

    # Open-interval target transform for Beta likelihood.
    beta_target_epsilon: 1.0e-4

    # Epsilon used when critique rewards have zero population variance.
    critique_normalization_epsilon: 1.0e-8

    # Exact instruction appended after the original question and solution.
    critique_prompt: "You have been given above a question, the thought process, and the resulting\nsolution. The solution may or may not be correct. Analyze the thought process\nand solution and at the end output your judgement on (a) whether the solution\nis correct or not (b) what parts of the thought process were correct or led to\ncorrect directions (c) what part of the thought process were dead-ends or\nincorrect or didn't later enable moving in the correct direction."

    # Optional structural JSONL audit directory used by smoke verification.
    audit_output_dir: null

  # Synchronous actor-only branch-revision GRPO.
  branch_revision_grpo:

    # Structured configuration target.
    _target_: verl.trainer.config.BranchRevisionGRPOConfig

    # Enable branch-analysis critiques and exact-prefix revised continuations.
    enable: false

    # Required when enabled: branch_only selects a branch and samples the suffix naturally;
    # seeded_revision retains the existing critique-proposed continuation seed.
    revision_mode: null

    # Train critique tokens with a separate policy initialized from actor_rollout_ref.model.path.
    separate_critique_model: false

    # For these first global steps, train critique rows but not original or revised-suffix rows.
    critique_warmup_steps: 0

    # Dedicated Ray resource pool for the separate critique policy and its rollout engine.
    critique_model_nnodes: 1
    critique_model_n_gpus_per_node: 8

    # Normalize critique rewards either within each original rollout's IID critiques or across all critiques
    # in the complete synchronous training iteration. This is never scoped to an optimizer microbatch or rank.
    critique_grpo_grouping: per_original

    # Critique advantage estimator: centered GRPO, an external pass@1 baseline without recentering,
    # or paired counterfactual uplift max(0, diagnostic_success - direct_control_success).
    critique_advantage_mode: grpo

    # Distribute external critique weight equally across eligible prompts, or by remaining pass@1 headroom.
    critique_prompt_weighting: equal_prompt

    # Additive penalty applied to malformed or otherwise structurally invalid critiques in pass_at_1 mode.
    critique_invalid_penalty: 0.20

    # Additive penalty applied to structurally valid but learnability-rejected critiques in pass_at_1 mode.
    critique_learnability_rejection_penalty: 0.05

    # Lower bound for the per-iteration RMS divisor used by pass_at_1 critique advantages.
    critique_advantage_rms_floor: 0.10

    # Symmetric clip applied after RMS scaling and before prompt weighting.
    critique_advantage_clip: 5.0

    # Exponent on prompt headroom (1 - prompt pass@1) for per-prompt critique row weighting.
    critique_prompt_headroom_exponent: 1.0

    # Optionally condition recovery critiques on a successful original rollout from the same prompt.
    recovery_reference_mode: none

    # Deterministic seed used to independently select a successful sibling for each critique.
    recovery_reference_selection_seed: 0

    # Number of IID critiques sampled for every incorrect original rollout.
    num_critiques: 4

    # Critique incorrect rollouts with the recovery objective.
    enable_recovery: true

    # Also critique correct rollouts with the positive compression objective.
    enable_positive_compression: false

    # Number of IID compression critiques sampled for every correct original rollout.
    num_positive_critiques: 4

    # Relative length reduction that earns full positive-compression credit.
    positive_compression_target: 0.25

    # In branch-only mode, force the critique reward to zero when its branch boundary is at or before this fraction of the original rollout.
    min_rewarded_prefix_fraction: 0.10

    # Aggregate replacement and matched-window token log-probabilities by mean or minimum.
    learnability_logprob_statistic: mean

    # Gate replacement seeds by standard-deviation distance or percentile.
    learnability_threshold_mode: stddev

    # In stddev mode, reject seeds more than this many population standard deviations below the window mean.
    max_seed_window_stddevs: 15.0

    # Reject replacement seeds below this length-matched original-window percentile.
    min_seed_window_percentile: 0.20

    # Replacement seeds at or above this percentile receive full learnability credit.
    full_credit_seed_window_percentile: 0.50

    # Maximum generated critique tokens; null uses the rollout response length.
    critique_max_response_length: 8192

    # Maximum tokens permitted inside the generated locator prefix tag.
    branch_max_tokens: 128

    # Maximum tokens permitted in the appended new-continuation suffix.
    new_continuation_max_tokens: 256

    # Require this much generation capacity after the edited prefix.
    min_continuation_tokens: 128

    # Absolute tolerance used when validating strict binary environment rewards.
    reward_tolerance: 1.0e-6

    # Exact instruction appended after an incorrect attempted solution.
    critique_prompt: |-
      The attempted solution above is incorrect. Analyze it with the goal of improving
      its chance of solving the task within the remaining token budget.

      Reason about which parts/steps meaningfully narrowed the available
      possibilities or pruned the search space and which parts/steps did not. Explain when the trajectory should have
      changed direction and what direction would have been more productive. Then
      select an appropriate point at which to revise the trajectory.

      Select a short coherent span of the attempted solution that immediately
      precedes the new continuation you want to propose. Put this span inside
      <prefix>. The text inside <prefix> will be used to locate the revision in the
      attempted solution. At the matching location, the original trajectory from the
      start of that prefix onward will be replaced by the text inside
      <prefix + new continuation>.

      Choose <prefix> so that both the point immediately before it and the point
      immediately after it fall between coherent steps, not in the middle of a
      thought or action. Neither boundary may be inside an open mathematical or
      delimited block. In particular, do not place either boundary between an
      opening $$ and its matching closing $$, between \[ and \], inside a
      \begin{...}...\end{...} environment, or inside a fenced code block. If the
      prefix includes such a block, include the complete block with both its opening
      and closing delimiters.

      Treat the point immediately after <prefix> as the information boundary for the
      new continuation.

      The new continuation may use an idea that also appears later in the trajectory
      only when the task and the trajectory through the end of the prefix already
      provide a reasonable basis for proposing that idea as the next direction.

      Consider the trajectory counterfactually with everything after the prefix
      hidden. If work performed after the prefix materially changed what was known,
      narrowed the available possibilities, or made the idea substantially more
      plausible, do not place that idea directly in the new continuation. Instead,
      propose the next local step needed to make that progress. We do not want to
      short-circuit useful exploration with hindsight.

      Do not compress a sequence of later developments into one hindsight statement.
      The new continuation should express one locally justified next move or
      direction and leave subsequent work for the continuation rollout to perform.
      In your analysis, explain why the information available through the end of the
      prefix supports the proposed continuation.

      Copy the text inside <prefix> character-for-character from one complete line or
      short coherent span of the attempted solution. Include enough distinctive
      adjacent text that the intended location is unique. Do not intentionally
      correct, normalize, paraphrase, or reformat anything inside <prefix>.

      Inside <prefix + new continuation>, first copy the entire text from <prefix>
      character-for-character. It must be a genuine character prefix of
      <prefix + new continuation>. Immediately after that copied prefix, append the
      proposed new continuation, including whatever spacing or transition is needed
      for it to flow naturally from the prefix. The appended text must be nonempty
      and concise.

      The appended new continuation must not state the final result in any form,
      declare that the task has been completed, or contain a boxed answer, answer
      delimiter, or final-answer phrase.

      After the free-form analysis, end with exactly one <prefix> tag pair followed
      by exactly one <prefix + new continuation> tag pair. Do not use either tag
      anywhere else. Permit only whitespace between the two tag pairs, and write
      nothing after the closing </prefix + new continuation> tag.

    # Recovery instruction used when a successful original rollout is supplied as privileged evidence.
    successful_reference_critique_prompt: |-
      The attempted solution above is incorrect. Analyze it with the goal of improving
      its chance of solving the task within the remaining token budget.

      A different original rollout sampled independently for the same task was
      successful. Use it as privileged evidence for comparing the two trajectories
      and diagnosing the attempted solution:

      <successful_rollout>
      {successful_rollout}
      </successful_rollout>

      The successful rollout is a diagnostic reference only. The text inside
      <prefix>, including the copy at the beginning of
      <prefix + new continuation>, must come from the incorrect attempted solution,
      never from the successful rollout.

      Reason about which parts/steps meaningfully narrowed the available
      possibilities or pruned the search space and which parts/steps did not. Explain when the trajectory should have
      changed direction and what direction would have been more productive. Then
      select an appropriate point at which to revise the trajectory.

      Select a short coherent span of the attempted solution that immediately
      precedes the new continuation you want to propose. Put this span inside
      <prefix>. The text inside <prefix> will be used to locate the revision in the
      attempted solution. At the matching location, the original trajectory from the
      start of that prefix onward will be replaced by the text inside
      <prefix + new continuation>.

      Choose <prefix> so that both the point immediately before it and the point
      immediately after it fall between coherent steps, not in the middle of a
      thought or action. Neither boundary may be inside an open mathematical or
      delimited block. In particular, do not place either boundary between an
      opening $$ and its matching closing $$, between \[ and \], inside a
      \begin{...}...\end{...} environment, or inside a fenced code block. If the
      prefix includes such a block, include the complete block with both its opening
      and closing delimiters.

      Treat the point immediately after <prefix> as the information boundary for the
      new continuation.

      The new continuation may use an idea that also appears later in the trajectory
      only when the task and the trajectory through the end of the prefix already
      provide a reasonable basis for proposing that idea as the next direction.

      Consider the proposed continuation counterfactually with everything after the
      prefix in the attempted solution and the entire successful rollout hidden. The
      successful rollout may help you diagnose what went wrong, but its contents were
      not available at the branch point and do not by themselves justify copying an
      idea into the new continuation. If the proposed direction is supported only by
      the hidden suffix or by developments shown in the successful rollout, do not
      place that idea directly in the new continuation. Instead, propose the next
      local step justified by the task and the attempted solution through the end of
      the prefix.

      Do not compress a sequence of later developments into one hindsight statement.
      The new continuation should express one locally justified next move or
      direction and leave subsequent work for the continuation rollout to perform.
      In your analysis, explain why the information available through the end of the
      prefix supports the proposed continuation.

      Copy the text inside <prefix> character-for-character from one complete line or
      short coherent span of the attempted solution. Include enough distinctive
      adjacent text that the intended location is unique. Do not intentionally
      correct, normalize, paraphrase, or reformat anything inside <prefix>.

      Inside <prefix + new continuation>, first copy the entire text from <prefix>
      character-for-character. It must be a genuine character prefix of
      <prefix + new continuation>. Immediately after that copied prefix, append the
      proposed new continuation, including whatever spacing or transition is needed
      for it to flow naturally from the prefix. The appended text must be nonempty
      and concise.

      The appended new continuation must not state the final result in any form,
      declare that the task has been completed, or contain a boxed answer, answer
      delimiter, or final-answer phrase.

      After the free-form analysis, end with exactly one <prefix> tag pair followed
      by exactly one <prefix + new continuation> tag pair. Do not use either tag
      anywhere else. Permit only whitespace between the two tag pairs, and write
      nothing after the closing </prefix + new continuation> tag.

    # Exact instruction appended after a correct solution.
    positive_critique_prompt: |-
      The solution above is correct. Analyze it with the goal of improving reasoning
      efficiency: reducing the amount of reasoning needed to reach the correct result
      without sacrificing correctness.

      Reason about which parts/steps meaningfully narrowed the available
      possibilities or pruned the search space and which parts/steps did not. Explain when the trajectory should have
      changed direction and what direction would have been more productive. Then
      select an appropriate point at which to revise the trajectory.

      Select a short coherent span of the solution that immediately precedes the new
      continuation you want to propose. Put this span inside <prefix>. The text inside
      <prefix> will be used to locate the revision in the solution. At the matching
      location, the original trajectory from the start of that prefix onward will be
      replaced by the text inside <prefix + new continuation>.

      Choose <prefix> so that both the point immediately before it and the point
      immediately after it fall between coherent steps, not in the middle of a
      thought or action. Neither boundary may be inside an open mathematical or
      delimited block. In particular, do not place either boundary between an
      opening $$ and its matching closing $$, between \[ and \], inside a
      \begin{...}...\end{...} environment, or inside a fenced code block. If the
      prefix includes such a block, include the complete block with both its opening
      and closing delimiters.

      Treat the point immediately after <prefix> as the information boundary for the
      new continuation.

      The new continuation may use an idea that also appears later in the trajectory
      only when the task and the trajectory through the end of the prefix already
      provide a reasonable basis for proposing that idea as the next direction.

      Consider the trajectory counterfactually with everything after the prefix
      hidden. If work performed after the prefix materially changed what was known,
      narrowed the available possibilities, or made the idea substantially more
      plausible, do not place that idea directly in the new continuation. Instead,
      propose the next local step needed to make that progress. We do not want to
      short-circuit useful exploration with hindsight.

      Do not compress a sequence of later developments into one hindsight statement.
      The new continuation should express one locally justified next move or
      direction and leave subsequent work for the continuation rollout to perform.
      In your analysis, explain why the information available through the end of the
